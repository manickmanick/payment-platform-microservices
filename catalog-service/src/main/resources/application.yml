server:
  port: ${SERVER_PORT:8086}
spring:
  application.name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:mysql://localhost:3306/catalog_db}
    username: ${CATALOG_DB_USERNAME:root}
    password: ${CATALOG_DB_PASSWORD:}
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
  servlet.multipart.max-file-size: 8MB
  servlet.multipart.max-request-size: 10MB
management.endpoints.web.exposure.include: health,info,prometheus,metrics
management.tracing.sampling.probability: ${TRACING_SAMPLING:1.0}
management.otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
springdoc.swagger-ui.path: /swagger-ui.html
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
catalog:
  internal-key: ${CATALOG_INTERNAL_KEY:local-internal-key-change-me}
order-service:
  url: ${ORDER_SERVICE_URL:http://localhost:8082}
logging.pattern.level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
