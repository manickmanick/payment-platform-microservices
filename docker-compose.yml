services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]

  food-delivery-frontend:
    build:
      context: ./food-delivery-frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    ports: ["3000:80"]
    depends_on: [api-gateway]

  user-service:
    build: ./user-service
    env_file: .env
    environment:
      SERVER_PORT: 8085
      JWT_SECRET: ${JWT_SECRET:-please_set_a_random_32_byte_minimum_secret}
      FRONTEND_URL: http://localhost:3000
      USER_DB_URL: ${USER_DB_URL}
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DRIVER_EMAILS: ${DRIVER_EMAILS:-}
      RESTAURANT_OWNER_EMAILS: ${RESTAURANT_OWNER_EMAILS:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on: [kafka]
    ports: ["8085:8085"]

  catalog-service:
    build: ./catalog-service
    env_file: .env
    environment:
      CATALOG_DB_URL: ${CATALOG_DB_URL:-}
      JWT_SECRET: ${JWT_SECRET:-please_set_a_random_32_byte_minimum_secret}
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:-root}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-}
      CATALOG_INTERNAL_KEY: ${CATALOG_INTERNAL_KEY:-local-internal-key-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports: ["8086:8086"]

  delivery-service:
    build: ./delivery-service
    env_file: .env
    environment:
      DELIVERY_DB_URL: ${DELIVERY_DB_URL:-}
      JWT_SECRET: ${JWT_SECRET:-please_set_a_random_32_byte_minimum_secret}
      DELIVERY_INTERNAL_KEY: ${DELIVERY_INTERNAL_KEY:-local-internal-key-change-me}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      ORDER_SERVICE_URL: http://order-service:8082
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on: [order-service, kafka]
    ports: ["8087:8087"]

  mail-service:
    build: ./mail-service
    env_file: .env
    environment:
      MAIL_DB_URL: ${MAIL_DB_URL:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_INTERNAL_KEY: ${MAIL_INTERNAL_KEY:-local-mail-key-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on: [kafka]
    ports: ["8088:8088"]

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    env_file: .env
    environment:
      ORDER_DB_URL: ${ORDER_DB_URL:-}
      CATALOG_SERVICE_URL: http://catalog-service:8086
      CATALOG_INTERNAL_KEY: ${CATALOG_INTERNAL_KEY:-local-internal-key-change-me}
      PAYMENT_SERVICE_URL: http://payment-service:8081
      DELIVERY_SERVICE_URL: http://delivery-service:8087
      MAIL_SERVICE_URL: http://mail-service:8088
      DELIVERY_INTERNAL_KEY: ${DELIVERY_INTERNAL_KEY:-local-internal-key-change-me}
      PAYMENT_INTERNAL_KEY: ${PAYMENT_INTERNAL_KEY:-local-payment-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-please_set_a_random_32_byte_minimum_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on: [kafka, schema-registry]
    ports: ["8082:8082"]

  payment-service:
    build: ./payment-service
    env_file: .env
    environment:
      PAYMENT_DB_URL: ${PAYMENT_DB_URL:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PAYMENT_INTERNAL_KEY: ${PAYMENT_INTERNAL_KEY:-local-payment-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-please_set_a_random_32_byte_minimum_secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on: [kafka, schema-registry]
    ports: ["8081:8081"]

  api-gateway:
    build: ./api-gateway
    environment:
      USER_SERVICE_URL: http://user-service:8085
      CATALOG_SERVICE_URL: http://catalog-service:8086
      ORDER_SERVICE_URL: http://order-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8081
      DELIVERY_SERVICE_URL: http://delivery-service:8087
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on: [user-service, catalog-service, order-service, payment-service, delivery-service, mail-service]
    ports: ["8080:8080"]

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8084:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.1
    container_name: schema-registry
    ports:
      - "8083:8081"
    depends_on:
      - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
