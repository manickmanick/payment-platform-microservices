
server:
  port: 8081

spring:
  application:
    name: payment-service

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      enable-auto-commit: false
      properties:
#        "[spring.json.value.default.type]": com.payment.service.event.OrderCreatedEvent
#        "[spring.json.use.type.headers]": false
        "[schema.registry.url]": http://localhost:8083
        specific.avro.reader: true

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

    listener:
      ack-mode: record

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/payment_db}
    username: ${PAYMENT_DB_USERNAME:root}
    password: ${PAYMENT_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

payment:
  simulator:
    failure-mode: false
