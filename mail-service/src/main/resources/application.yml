server.port: ${SERVER_PORT:8088}
spring:
  application.name: mail-service
  datasource:
    url: ${MAIL_DB_URL:jdbc:mysql://localhost:3306/mail_db}
    username: ${MAIL_DB_USERNAME:root}
    password: ${MAIL_DB_PASSWORD:}
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: mail-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties.mail.smtp.auth: ${SMTP_AUTH:false}
    properties.mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
app.mail.from: ${MAIL_FROM:no-reply@example.com}
mail.internal-key: ${MAIL_INTERNAL_KEY:local-mail-key-change-me}
management.endpoints.web.exposure.include: health,info,prometheus,metrics
management.tracing.sampling.probability: ${TRACING_SAMPLING:1.0}
management.otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
springdoc.swagger-ui.path: /swagger-ui.html
