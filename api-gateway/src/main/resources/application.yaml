
server:
  port: 8084

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/orders/**

            - id: payment-service
              uri: http://localhost:8081
              predicates:
                - Path=/payments/**
