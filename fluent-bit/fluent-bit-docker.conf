[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

    storage.path        /var/fluent-bit/storage
    storage.sync        normal
    storage.checksum    off
    storage.max_chunks_up 128

    HTTP_Server           On
    HTTP_Listen           0.0.0.0
    HTTP_PORT             2020

[INPUT]
    Name              tail
    Tag               order-service
    Path              /logs/order-service/*.json
    Parser            json
    Read_from_Head    true
    Refresh_Interval  2
    storage.type filesystem

[INPUT]
    Name              tail
    Tag               payment-service
    Path              /logs/payment-service/*.json
    Parser            json
    Read_from_Head    true
    Refresh_Interval  2
    storage.type filesystem

[INPUT]
    Name              tail
    Tag               catalog-service
    Path              /logs/catalog-service/*.json
    Parser            json
    Read_from_Head    true
    Refresh_Interval  2
    storage.type filesystem

[OUTPUT]
    Name        loki
    Match       *
    Host        loki
    Port        3100
    Labels      job=food-delivery
    Label_Keys  $service,$level
    Line_Format json
    Retry_Limit  False
