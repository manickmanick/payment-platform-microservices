[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               order-service
    Path              /logs/order-service/*.json
    Parser            json
    Read_from_Head    true
    Refresh_Interval  2

[INPUT]
    Name              tail
    Tag               payment-service
    Path              /logs/payment-service/*.json
    Parser            json
    Read_from_Head    true
    Refresh_Interval  2

[INPUT]
    Name              tail
    Tag               catalog-service
    Path              /logs/catalog-service/*.json
    Parser            json
    Read_from_Head    true
    Refresh_Interval  2

[OUTPUT]
    Name        loki
    Match       *
    Host        loki
    Port        3100
    Labels      job=food-delivery
    Label_Keys  $service,$level
    Line_Format json
