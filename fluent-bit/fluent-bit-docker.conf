[SERVICE]
    Flush          1
    Log_Level      info
    Parsers_File   /fluent-bit/etc/parsers.conf

    storage.path           /var/fluent-bit/storage
    storage.sync           normal
    storage.checksum       off
    storage.max_chunks_up  128

    HTTP_Server    On
    HTTP_Listen    0.0.0.0
    HTTP_PORT      2020

[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224

[FILTER]
    Name          parser
    Match         *
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  Off

[OUTPUT]
    Name         loki
    Match        *
    Host         loki
    Port         3100
    Labels       job=food-delivery
    Label_Keys   $service,$level
    Line_Format  json
    Retry_Limit  False
