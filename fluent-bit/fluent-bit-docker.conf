
[SERVICE]
    Flush         1
    Log_Level     info

[INPUT]
    Name              tail
    Tag               order-service
    Path              /logs/order-service/*.json
    Parser            json
    Read_from_Head    true
    Refresh_Interval  2

[INPUT]
    Name              tail
    Tag               payment-service
    Path              /logs/payment-service/*.json
    Parser            json
    Read_from_Head    true
    Refresh_Interval  2

[INPUT]
    Name              tail
    Tag               catalog-service
    Path              /logs/catalog-service/*.json
    Parser            json
    Read_from_Head    true
    Refresh_Interval  2

[OUTPUT]
    Name   stdout
    Match  *
    Format json_lines
