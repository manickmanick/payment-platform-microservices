apiVersion: v1
kind: Namespace
metadata:
  name: food-delivery
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: user-service, namespace: food-delivery}
spec:
  replicas: 2
  selector: {matchLabels: {app: user-service}}
  template:
    metadata: {labels: {app: user-service}}
    spec:
      containers:
        - name: user-service
          image: YOUR_ECR_URI/user-service:latest
          ports: [{containerPort: 8085}]
          envFrom: [{secretRef: {name: food-delivery-secrets}}]
          env: [{name: SERVER_PORT, value: "8085"}, {name: SPRING_KAFKA_BOOTSTRAP_SERVERS, value: "kafka-bootstrap:9092"}, {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: food-delivery-secrets, key: JWT_SECRET}}}]
          readinessProbe: {httpGet: {path: /actuator/health, port: 8085}, initialDelaySeconds: 30, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health, port: 8085}, initialDelaySeconds: 45, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {cpu: 750m, memory: 768Mi}}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 10001}
---
apiVersion: v1
kind: Service
metadata: {name: user-service, namespace: food-delivery}
spec: {selector: {app: user-service}, ports: [{port: 8085, targetPort: 8085}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog-service, namespace: food-delivery}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog-service}}
  template:
    metadata: {labels: {app: catalog-service}}
    spec:
      containers:
        - name: catalog-service
          image: YOUR_ECR_URI/catalog-service:latest
          ports: [{containerPort: 8086}]
          envFrom: [{secretRef: {name: food-delivery-secrets}}]
          env: [{name: JWT_SECRET, valueFrom: {secretKeyRef: {name: food-delivery-secrets, key: JWT_SECRET}}}]
          readinessProbe: {httpGet: {path: /actuator/health, port: 8086}, initialDelaySeconds: 30, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health, port: 8086}, initialDelaySeconds: 45, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {cpu: 750m, memory: 768Mi}}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 10001}
---
apiVersion: v1
kind: Service
metadata: {name: catalog-service, namespace: food-delivery}
spec: {selector: {app: catalog-service}, ports: [{port: 8086, targetPort: 8086}]}
---
